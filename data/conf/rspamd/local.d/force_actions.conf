rules {
  WHITELIST_FORWARDING_HOST_NO_REJECT {
    action = "add header";
    expression = "WHITELISTED_FWD_HOST";
    require_action = ["reject"];
  }
  WHITELIST_FORWARDING_HOST_NO_GREYLIST {
    action = "no action";
    expression = "WHITELISTED_FWD_HOST";
    require_action = ["greylist", "soft reject"];
  }
  INCIDENT_WILLIAM_GMAIL_INTERNAL_NO_REJECT {
    action = "no action";
    expression = "INCIDENT_WILLIAM_GMAIL_SMTP_FROM & INCIDENT_WILLIAM_GMAIL_MIME_FROM & RCPT_MAILCOW_DOMAIN & R_SPF_ALLOW & DMARC_POLICY_ALLOW & !CLAM_VIRUS & !VIRUS_FOUND & !OLEFY_MACRO";
    require_action = ["reject"];
  }
  INCIDENT_WILLIAM_GMAIL_INTERNAL_NO_GREYLIST {
    action = "no action";
    expression = "INCIDENT_WILLIAM_GMAIL_SMTP_FROM & INCIDENT_WILLIAM_GMAIL_MIME_FROM & RCPT_MAILCOW_DOMAIN & R_SPF_ALLOW & DMARC_POLICY_ALLOW & !CLAM_VIRUS & !VIRUS_FOUND & !OLEFY_MACRO";
    require_action = ["greylist", "soft reject"];
  }
}
